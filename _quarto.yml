project:
  type: website
  output-dir: _site
  post-render:
    - scripts/localize-navbar.ts

website:
  title: "日本・オーストリア研究者ネットワーク"
  image: assets/images/jarnet_logo.svg
  favicon: assets/images/jarnet_favicon.svg
  site-url: https://jpn-aut-research.github.io/jpn-aut-research.github.io/
  description: "オーストリアを拠点とする日本人研究者のための情報共有・交流の場"
  navbar:
    toggle-position: right
    background: "#F8F8F8"
    logo: assets/images/jarnet_nav_logo.svg
    logo-alt: "JARNet logo"
    title: false
    left:
      - href: index.qmd
        text: ホーム
      - href: about.qmd
        text: 概要
      - href: events.qmd
        text: イベント
      - href: mailing-list.qmd
        text: メーリングリスト
      - href: links.qmd
        text: リンク集
      - href: contact.qmd
        text: 連絡先
    right:
      - icon: globe2
        text: 日本語
        aria-label: 言語を選択
        menu:
          - text: 日本語
            href: index.qmd
          - text: English
            href: en/index.qmd
          # - text: Deutsch
          #   href: de/index.qmd


format:
  html:
    toc: false
    toc-location: right
    theme: default
    css: assets/css/template.css
    lang: ja
    code-fold: false
    link-external-newwindow: true

lang: ja
